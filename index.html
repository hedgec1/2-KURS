<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarix baraban o'yini</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--text:#2b2118;--muted:#7a6a58;--accent:#8c2f1b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--card:#2a231b;--text:#f3ead9;--muted:#b3a38c;--accent:#e0663f}}
:root[data-theme="dark"]{--bg:#1d1812;--card:#2a231b;--text:#f3ead9;--muted:#b3a38c;--accent:#e0663f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px}
h1{font-size:clamp(1.4rem,5vw,2.2rem);margin:0 0 4px;text-align:center}
.sub{color:var(--muted);margin:0 0 16px;text-align:center}
.wheel-wrap{position:relative;width:min(92vw,62vh,560px);aspect-ratio:1}
.stage,.left,.right{display:flex;flex-direction:column;align-items:center;width:100%}
.stage{flex:1;justify-content:center}
#fs{margin:0 0 12px}
@media (min-width:900px) and (orientation:landscape){
 body{padding:2vh 3vw}
 h1{font-size:clamp(2rem,3.4vw,4rem)}
 .sub{font-size:clamp(1rem,1.5vw,1.8rem)}
 .stage{flex-direction:row;gap:4vw}
 .left,.right{width:auto}
 .wheel-wrap{width:min(46vw,76vh)}
 .card,.chips,.hint{width:min(44vw,760px)}
 .card{padding:3vh 2.5vw;margin-top:2vh}
 .theme{font-size:clamp(1rem,1.5vw,1.8rem)}
 .q{font-size:clamp(1.1rem,1.8vw,2.2rem)}
 .item{font-size:clamp(2rem,4.2vw,5rem)}
 .count{font-size:clamp(.9rem,1.2vw,1.4rem)}
 #spin{font-size:clamp(1.1rem,2vw,2.2rem);padding:1.4vh 3vw}
 .card button{font-size:clamp(1rem,1.6vw,1.8rem);padding:1.2vh 2.2vw}
 .chip{font-size:clamp(.9rem,1.3vw,1.5rem)}
 .hint{font-size:clamp(.85rem,1.2vw,1.4rem)}
}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:32px solid var(--accent);filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));z-index:2}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:12px 32px;background:var(--accent);color:#fff;font-size:1.1rem;font-weight:bold;margin-top:18px}
button:disabled{opacity:.5;cursor:default}
button.alt{background:transparent;color:var(--muted);border:1px solid var(--muted);font-size:.9rem;padding:8px 18px;font-weight:normal}
.card{background:var(--card);border-radius:16px;padding:20px 22px;margin-top:20px;width:min(92vw,520px);text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.15);display:none}
.card.show{display:block}
.theme{color:var(--accent);font-weight:bold;letter-spacing:.05em;text-transform:uppercase;font-size:.85rem}
.q{margin:10px 0 6px;color:var(--muted)}
.q:empty{display:none}
.item{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:bold;margin:10px 0;line-height:1.15;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;width:min(92vw,520px)}
.chip{padding:7px 14px;font-size:.9rem;margin:0;color:#fff;font-weight:normal}
.chip.off{background:transparent!important;color:var(--muted);border:1px dashed var(--muted);text-decoration:line-through}
.hint{color:var(--muted);font-size:.85rem;margin:16px 0 0;text-align:center}
.card button{margin-top:12px;padding:10px 24px;font-size:1rem}
.count{color:var(--muted);font-size:.85rem;margin-top:8px}
</style>
</head>
<body>
<h1>🏺 Tarix baraban o'yini</h1>
<p class="sub">Barabanni aylantiring va mavzuni aniqlang</p>
<button class="alt" id="fs" hidden>⛶ To'liq ekran</button>
<main class="stage"><section class="left">
<div class="wheel-wrap"><div class="pointer"></div><canvas id="c"></canvas></div>
<button id="spin">AYLANTIRISH</button>
</section><section class="right">
<p class="hint">Mavzuni o'chirish yoki qaytarish uchun ustiga bosing:</p>
<div class="chips" id="chips"></div>
<div class="card" id="card">
  <div class="theme" id="theme"></div>
  <div class="q" id="q"></div>
  <div class="item" id="item"></div>
  <div class="count" id="count"></div>
  <button id="next">Keyingi savol ➜</button>
</div>
<button class="alt" id="reset">Qayta boshlash</button>
</section></main>
<script>
const DATA=[
{n:"Shaxs",c:"#b5452b",items:["Viktoriya","Abdulhamid II","Vudro Vilson","Aleksandr II","Napoleon III","Vilgelm I"]},
{n:"Atama",c:"#c58a1f",items:["Intervensiya","Dominion","Fashizm","Totalitar","Konsentratsiya","Anneksiya"]},
{n:"Konferensiya",c:"#4a7c59",items:["I Panamerika konferensiyasi","Vashington konferensiyasi","Myunxen kelishuvi","Berlin konferensiyasi","Versal konferensiyasi","Bryussel konferensiyasi"]},
{n:"Sanalar",c:"#2f6c8f",items:["1876-yil","1900-yil","1914-1918-yillar","1929-yil","1917-yil","1933-yil"]}
];
DATA.forEach(d=>d.on=true);
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let rot=0,spinning=false,cur=null,used=DATA.map(()=>0);
const act=()=>DATA.filter(d=>d.on);
function size(){const s=cv.clientWidth,d=window.devicePixelRatio||1;cv.width=cv.height=s*d;draw()}
function draw(){
 const L=act(),SEG=2*Math.PI/L.length,W=cv.width,R=W/2-6;
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,W);
 ctx.translate(W/2,W/2);ctx.rotate(rot);
 L.forEach((d,i)=>{
  ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,i*SEG,(i+1)*SEG);ctx.closePath();
  ctx.fillStyle=d.c;ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=W/150;ctx.stroke();
  ctx.save();ctx.rotate(i*SEG+SEG/2);ctx.fillStyle="#fff";ctx.textAlign="right";ctx.textBaseline="middle";
  ctx.font="bold "+W/22+"px Georgia,serif";ctx.fillText(d.n,R-W/28,0);ctx.restore();
 });
 ctx.setTransform(1,0,0,1,0,0);ctx.translate(W/2,W/2);
 ctx.beginPath();ctx.arc(0,0,W/16,0,7);ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#8c2f1b";ctx.lineWidth=W/100;ctx.stroke();
}
function chips(){
 const box=document.getElementById('chips');box.innerHTML='';
 DATA.forEach(d=>{
  const b=document.createElement('button');b.className='chip'+(d.on?'':' off');b.textContent=d.n;b.style.background=d.on?d.c:'';
  b.onclick=()=>{
   if(spinning)return;
   if(d.on&&act().length===1){alert("Kamida bitta mavzu qolishi kerak!");return}
   d.on=!d.on;
   if(!d.on&&cur===d){cur=null;document.getElementById('card').classList.remove('show')}
   chips();draw();
  };
  box.appendChild(b);
 });
}
function spin(){
 if(spinning)return;spinning=true;
 document.getElementById('spin').disabled=true;document.getElementById('card').classList.remove('show');
 const L=act(),SEG=2*Math.PI/L.length,idx=Math.floor(Math.random()*L.length);
 const a=(idx+0.15+0.7*Math.random())*SEG,target=-Math.PI/2-a,m=2*Math.PI;
 const delta=(((target-rot)%m)+m)%m+m*(5+Math.floor(Math.random()*3));
 const start=rot,dur=4500,t0=performance.now();
 (function f(t){
  const p=Math.min((t-t0)/dur,1),e=1-Math.pow(1-p,4);
  rot=start+delta*e;draw();
  if(p<1)requestAnimationFrame(f);else{spinning=false;document.getElementById('spin').disabled=false;cur=L[idx];show()}
 })(t0);
}
function show(){
 const d=cur,i=DATA.indexOf(d);
 if(used[i]>=d.items.length)used[i]=0;
 const pick=d.items[used[i]];
 used[i]++;
 document.getElementById('theme').textContent=d.n;
 document.getElementById('q').textContent='';
 document.getElementById('item').textContent=pick;
 document.getElementById('count').textContent="Savol "+used[i]+" / "+d.items.length;
 document.getElementById('card').classList.add('show');
}
document.getElementById('spin').onclick=spin;
document.getElementById('next').onclick=()=>{if(cur&&!spinning)show()};
document.getElementById('reset').onclick=()=>{used=DATA.map(()=>0);cur=null;document.getElementById('card').classList.remove('show')};
const fs=document.getElementById('fs'),de=document.documentElement;
if(de.requestFullscreen){fs.hidden=false;fs.onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():de.requestFullscreen()}catch(e){}};
document.addEventListener('fullscreenchange',()=>{fs.textContent=document.fullscreenElement?"✕ Ekrandan chiqish":"⛶ To'liq ekran";size()})}
window.addEventListener('resize',size);chips();size();
</script>
</body>
</html>
